<section class="h100 bcred white dac">
  <nav class="slider tshade1 dc gap05-" data-iterate="articles" data-src="assets/json/articles.json">
    <div class="sl" skip><a><i class="icon64 bcblack02 d0">&#706;</i></a></div>
    <input type="radio" name="slider" data-set="id:id" id="slide{id}" onifdata-set="([{id}]:[1])/setattr:[checked]">
    <label data-set="id:id" for="slide{id}" class="footer icon24 pb1">&#9679;</label>
    <section>
      <article class="white w70 xm_w80p">
        <h1 class="fs17" data-get="title"></h1>
        <h3 class="beige tshade1" data-get="summary"></h3>
        <a data-set="link:link" href="{link}" class="button p1 bcblack white mt2 br05 xm_w100p" globalize-get>Read
          more</a>
      </article>
      <figure data-set="img:image" bgimage="{img}">
        <span class="bcblack04 pa hm100 w100"></span>
      </figure>
    </section>
    <div class="sr" skip><a><i class="icon64 bcblack02 d0">&#707;</i></a></div>
  </nav>
</section>

<section class="light">
  <article class="pauto xs_p0 sm_p0 xm_p0 md_1r lg_p1r xl_p1r xxl_p1r wm70">
    <div class="box cards m1- p1- br05- bcwhite- border- bo0- tac md_gtc2 xl_gtc3 xxl_gtc3 xxxl_gtc4"
      data-iterate="articles" data-src="assets/json/articles.json">
      <figure class="shade0 p1">
        <a data-set="link:link" href="{link}">
          <img data-set="t:thumbnail"
            onifdata-set="([{t}]![])/setattr:[src][{t}]?setattr:[src][/assets/img/placeholder_article.png]"
            width="100%">
          <p class="fwb pt1" data-get="title">...</p>
          <figcaption data-get="summary">...</figcaption>
        </a>
      </figure>
    </div>
  </article>
</section>

<section include="./_includes/footer.html" class="bcred white white- p1"></section>
</content>
