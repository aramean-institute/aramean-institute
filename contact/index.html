<script src="https://cdn.front.nu/nightly/front.js"></script>
<template srcdoc="../index" src="../_templates/default"></template>
<title globalize-get="contact_us">Contact Us</title>
<div class="alert banner shade1 br0 pauto pt2 pb2 bcred white-">
	<h1 bindglobal="title:title">{title}</h1>
</div>

<article class="wc_xl" screen-xxs="padding:[1rem]" screen-xs="padding:[inherit]">
	<section id="contact" class="pauto">
		<h1 globalize-get>Send Us a Message</h1>
		<h6 margintop="1rem" marginbottom="2rem" globalize-get>We typically respond within 48
			hours. For all inquiries, please us the form below.</h6>

		<form class="gaph2-" method="post" action="https://mail.aramean.institute"
			data-onsuccess="hide:#contact;show:#complete" form-throttle="2000" data-onerror="show:#error">

			<div class="group">
				<input name="name" type="text" class="f1 bw1 bos8 bocblack02" placeholder="Full name" placeholdercolor="silver"
					form-invalid="#name_tip:[Please enter your name]" required>
				<small id="name_tip" color="red"></small>
			</div>

			<div class="group">
				<input name="email" type="text" class="f1 bw1 bos8 bocblack02" placeholder="Email" placeholdercolor="silver"
					form-invalid="#email_tip:[Please enter your email]" required>
				<small id="email_tip" color="red"></small>
			</div>

			<div class="group">
				<select name="subject" class="bw1 bos8 bocblack02">
					<option value="1" globalize-get="membership">Membership</option>
					<option value="2" globalize-get="cooperation">Cooperation</option>
					<option value="3" globalize-get="research">Research</option>
					<option value="4" globalize-get="media">Media/Press</option>
					<option value="5" globalize-get="volunteering">Volunteering</option>
					<option value="0" globalize-get="other" selected>Other</option>
				</select>
			</div>

			<div class="group">
				<textarea name="message" class="w100 h10r bw1 bos8 bocblack02" placeholder="Message" placeholdercolor="silver"
					globalize-target="placeholder" form-invalid="#message_tip:[Please enter a message]" required></textarea>
				<small id="message_tip" color="red"></small>
			</div>

			<div id="error" bgcolor="red" color="yellow" margintop="1rem" marginbottom="2rem" padding="1rem" hide>
				Something went wrong. Please try again.
			</div>

			<div margintop="1rem" gap="1rem" fontsize="90%">
				<button radius="2rem" padding="1rem 2rem" bgcolor="transparent" color="black" type="reset" globalize-get="reset">Reset</button>
				<button radius="2rem" padding="1rem 2rem" bgcolor="red" type="submit" globalize-get="send_message">Send message</button>
			</div>

			<small color="gray" margintop="1rem">Your information will not be shared with third parties.</small>

		</form>
	</section>

	<section id="complete" class="pauto tac" hide>
		<h1 globalize-get="thank_you">Thank you!</h1>
		<p globalize-get="page_contact_complete">Your message was sent successfully.</p>
		<i class="icon mt2">&#8962;</i>
		<a href="/" globalize-get="go_to_startpage">Go to startpage</a>
	</section>
</article>

<section include="./_includes/footer.html" class="bcred white white- p1"></section>
